        <div class="auth-page-wrapper">

                    <!-- Note: Assuming logo needs to be white on dark bg. If separate white logo exists, use that. Or filter. using filter as fallback -->
                </div>

                <div class="auth-left-content">
                    <h1 class="auth-left-header">
                        Block disposable emails.<br>
                        Only real users.<br>
                        Keep your platform clean and secure.
                    </h1>
                </div>
            </div>

            <!-- Right Section (Form) -->
            <div class="auth-right-section">
                <!-- Mobile Header -->

                <div class="auth-form-container">
                    <h2 class="auth-title">Create an Account</h2>
                    <p class="auth-subtitle">Get started with an account on Stopreg</p>

                    <form>
                        <!-- Email -->
                        <div class="form-group">
                            <label for="email">Email</label>
                            <input type="email" id="email" class="form-input" placeholder="Enter your email" required />
                        </div>

                        <!-- First Name -->
                        <div class="form-group">
                            <label for="fname">First Name</label>
                            <input type="text" id="fname" class="form-input" placeholder="Enter first name" required />
                        </div>

                        <!-- Last Name -->
                        <div class="form-group">
                            <label for="lname">Last Name</label>
                            <input type="text" id="lname" class="form-input" placeholder="Enter last name" required />
                        </div>

                        <!-- Password -->
                        <div class="form-group">
                            <label for="password">Password</label>
                            <div class="password-input-wrapper">
                                <input type="password" id="password" class="form-input" placeholder="Create password"
                                    required />
                                <button type="button" class="toggle-password" data-target="password">
                                    <img src="/assets/icons/iconoir_eye-closed.svg" alt="Toggle" />
                                </button>
                            </div>
                        </div>

                        <!-- Confirm Password -->
                        <div class="form-group">
                            <label for="cpassword">Confirm Password</label>
                            <div class="password-input-wrapper">
                                <input type="password" id="cpassword" class="form-input" placeholder="Confirm password"
                                    required />
                                <button type="button" class="toggle-password" data-target="cpassword">
                                    <img src="/assets/icons/iconoir_eye-closed.svg" alt="Toggle" />
                                </button>
                            </div>
                        </div>

                        <button type="submit" class="submit-btn">Create an Account</button>
                    </form>

                    <div class="auth-footer">
                        Already have an account? <a href="/sign-in.html">Log In</a>
                    </div>
                </div>
