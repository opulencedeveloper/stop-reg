<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Custom Tooltip Line Chart</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/izitoast/1.4.0/css/iziToast.css"
    integrity="sha512-DIW4FkYTOxjCqRt7oS9BFO+nVOwDL4bzukDyDtMO7crjUZhwpyrWBFroq+IqRe6VnJkTpRAS6nhDvf0w+wHmxg=="
    crossorigin="anonymous" referrerpolicy="no-referrer" />
    <style>
      body {
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        background: #fff;
        font-family: "Poppins", sans-serif;
      }

      .chart-container {
        width: 90%;
        max-width: 900px;
        position: relative;
      }

      canvas {
        width: 100% !important;
        height: 100% !important;
      }

      /* Custom tooltip bubble */
      .custom-tooltip {
        width: 125.6px;
        height: 62px;
        top: 0 !important;
        position: absolute;
        box-shadow: 0px 3px 6px rgba(0, 0, 0, 0.1);
        text-align: center;
        background-image: url("/assets/icons/custom-too-tip.svg");
        background-size: cover;
        background-repeat: no-repeat;
        pointer-events: none;
        opacity: 0;
        transition: all 0.15s ease-out;
      }

      .custom-tooltip strong {
        display: block;
        font-size: 16px;
        font-weight: 600;
        color: #000;
        margin-top: 10px;
      }

      .custom-tooltip span {
        font-size: 12px;
        color: #777;
      }
    </style>
  </head>
  <body>
    <div class="chart-container">
      <canvas id="lineChart"></canvas>
      <div id="chart-tooltip" class="custom-tooltip">
        <strong>3.2</strong>
        <span>September</span>
      </div>
    </div>

    <script>
      const ctx = document.getElementById("lineChart").getContext("2d");
      const tooltipEl = document.getElementById("chart-tooltip");

      const selectorImg = new Image();
      selectorImg.src = "/assets/icons/Selector.svg";
      const selectorScale = 1.0;

      selectorImg.onload = () => {
        const naturalW = selectorImg.naturalWidth;
        const naturalH = selectorImg.naturalHeight;
        const imgW = naturalW * selectorScale;
        const imgH = naturalH * selectorScale;

        const data = {
          labels: [
            "Jan",
            "Feb",
            "Mar",
            "Apr",
            "May",
            "Jun",
            "Jul",
            "Aug",
            "Sep",
            "Oct",
            "Nov",
            "Dec",
          ],
          datasets: [
            {
              data: [
                2.8, 3.0, 2.5, 3.1, 3.6, 3.3, 3.4, 3.2, 3.2, 3.0, 2.9, 3.1,
              ],
              borderColor: "#0099cc",
              tension: 0.45,
              borderWidth: 3,
              pointRadius: 0,
              pointHoverRadius: 0,
            },
            {
              data: [
                3.4, 3.5, 3.0, 3.3, 3.7, 3.2, 3.1, 3.4, 3.0, 3.6, 3.5, 3.2,
              ],
              borderColor: "#cc0000",
              tension: 0.45,
              borderWidth: 3,
              pointRadius: 0,
              pointHoverRadius: 0,
            },
            {
              data: [
                2.9, 2.7, 3.2, 2.8, 3.0, 3.1, 2.9, 3.3, 3.2, 3.5, 3.4, 3.0,
              ],
              borderColor: "#0044cc",
              tension: 0.45,
              borderWidth: 3,
              pointRadius: 0,
              pointHoverRadius: 0,
            },
          ],
        };

        const config = {
          type: "line",
          data,
          options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: {
              legend: { display: false },
              tooltip: {
                enabled: false,
                external: function (context) {
                  const { chart, tooltip } = context;
                  if (tooltip.opacity === 0) {
                    tooltipEl.style.opacity = 0;
                    return;
                  }

                  const body = tooltip.body?.[0]?.lines?.[0] || "";
                  const shortLabel = tooltip.title?.[0] || "";

                  const fullMonthMap = {
                    Jan: "January",
                    Feb: "February",
                    Mar: "March",
                    Apr: "April",
                    May: "May",
                    Jun: "June",
                    Jul: "July",
                    Aug: "August",
                    Sep: "September",
                    Oct: "October",
                    Nov: "November",
                    Dec: "December",
                  };

                  tooltipEl.querySelector("strong").innerHTML = body;
                  tooltipEl.querySelector("span").innerHTML =
                    fullMonthMap[shortLabel] || shortLabel;

                  const activePoint = chart.tooltip._active?.[0];
                  if (!activePoint) return;

                  const { x, y } = activePoint.element;
                  const chartRect = chart.canvas.getBoundingClientRect();
                  const absoluteX = chartRect.left + window.pageXOffset + x;
                  const absoluteY = chartRect.top + window.pageYOffset + y;

                  tooltipEl.style.opacity = 1;
                  tooltipEl.style.display = "block";

                  const tooltipWidth = tooltipEl.offsetWidth;
                  const tooltipOffsetX = 0; // adjust manually (+ right, - left)
                  const tooltipOffsetY = 6; // adjust distance above selector if needed

                  tooltipEl.style.left =
                    absoluteX - tooltipWidth / 2 + tooltipOffsetX + "px";
                  tooltipEl.style.top =
                    absoluteY -
                    imgH -
                    tooltipEl.offsetHeight -
                    tooltipOffsetY +
                    "px";
                },
              },
            },
            interaction: { intersect: false, mode: "index" },
            scales: {
              x: {
                grid: {
                  color: "#eee",
                  drawTicks: false,
                  offset: false, // ✅ makes grid reach both edges
                },
                ticks: {
                  color: "#000",
                  padding: 13,
                },
                border: {
                  display: true,
                  color: "#ccc",
                },
              },
              y: {
                grid: { display: false },
                ticks: { display: false },
              },
            },
            layout: {
              padding: {
                left: 0,
                right: 0, // ✅ full edge reach for Jan/Dec lines
              },
            },
          },
          plugins: [
            {
              id: "hideGridBottomBand",
              afterDraw: (chart) => {
                const { ctx, chartArea } = chart;
                if (!chartArea) return;
                const bandHeight = 12;
                ctx.save();
                ctx.fillStyle = "#ffffff";
                ctx.fillRect(
                  chartArea.left,
                  chartArea.bottom - bandHeight - 1,
                  chartArea.width,
                  bandHeight
                );
                ctx.restore();
              },
            },
            {
              id: "customSelector",
              afterDraw: (chart) => {
                if (!chart.tooltip?._active?.length || !selectorImg.complete)
                  return;

                const ctx = chart.ctx;
                const activePoint = chart.tooltip._active[0];
                const x = activePoint.element.x;
                const y = activePoint.element.y;

                const bottomY = chart.scales.y.bottom - 13;

                ctx.save();
                ctx.beginPath();
                ctx.moveTo(x, y);
                ctx.lineTo(x, bottomY);
                ctx.lineWidth = 2;
                ctx.strokeStyle = "#049286";
                ctx.globalAlpha = 0.9;
                ctx.stroke();

                const drawX = x - imgW / 2;
                const drawY = y;
                ctx.drawImage(selectorImg, drawX, drawY, imgW, imgH);
                ctx.restore();
              },
            },
          ],
        };

        new Chart(ctx, config);
      };
    </script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/izitoast/1.4.0/js/iziToast.min.js"
      integrity="sha512-Zq9o+E00xhhR/7vJ49mxFNJ0KQw1E1TMWkPTxrWcnpfEFDEXgUiwJHIKit93EW/XxE31HSI5GEOW06G6BF1AtA=="
      crossorigin="anonymous" referrerpolicy="no-referrer" defer></script>
    <script src="/assets/js/main.js" defer></script>
    <!-- Zoho SalesIQ Live Chat Widget -->
    <script>window.$zoho=window.$zoho||{};$zoho.salesiq=$zoho.salesiq||{ready:function(){}}</script>
    <script id="zsiqscript" src="https://salesiq.zohopublic.com/widget?wc=siqb661b287ac7cb906ea5ab7727e759477068b9f96d2ed573eb669fee432ac11a1" defer></script>
  </body>
</html>
