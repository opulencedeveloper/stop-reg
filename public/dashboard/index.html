<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <!-- Favicon -->
    <!-- <link href="img/favicon.ico" rel="icon"> -->
    <title>StopReg</title>
    <meta name="robots" content="index, follow" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta property="og:title" content="StopReg" />
    <meta property="og:description" content="" />
    <link href="/assets/css/fonts.css" rel="stylesheet" />
    <link href="/assets/css/variables.css" rel="stylesheet" />
    <link href="/assets/css/styles.css" rel="stylesheet" />
    <link href="/assets/css/dashboard/index.css" rel="stylesheet" />
  </head>

  <body>
    <!-- Loading Spinner Start -->
    <div id="spinner-body" class="spinner-body">
      <div class="lds-roller">
        <div></div>
        <div></div>
        <div></div>
        <div></div>
        <div></div>
        <div></div>
        <div></div>
        <div></div>
      </div>
    </div>
    <!-- Loading Spinner End -->

    <div id="content">
      <div class="dash-wrapper">
        <nav class="dash-nav">
          <div class="dash-logo">
            <img src="/assets/logo/stopreg-logo.svg" />
          </div>

          <div class="dash-nav-link">
            <a class="dash-nav-link-active" href="#">
              <div>
                <img src="/assets/icons/dashboard-active.svg" />
              </div>
              <p class="dash-nav-link-active">Dashboard</p>
            </a>
          </div>
        </nav>
        <div class="dash-bdy">
          <header class="dash-header">
            <p class="dash-header-tle">My Account</p>
            <div class="dash-header-auth">
              <div class="dash-header-avatar">
                <img src="/assets/icons/avatar-filled.svg" />
              </div>
              <button class="dash-logout">
                <div class="dash-logout-icon">
                  <img src="/assets/icons/logout-line.svg" />
                </div>
                <p class="dash-logout-tle">Log Out</p>
              </button>
            </div>
          </header>
          <div class="dash-inner-section">
            <section class="dash-plan">
              <div class="dash-plan-sectone">
                <p class="dash-plan-tle">Current plan</p>
                <p class="dash-plan-subtle">
                  Expires: <span>12 October 2023</span>
                </p>
              </div>
              <div class="dash-plan-secttwo">
                <div class="dash-plan-secttwo-inner">
                  <p>Free Account</p>
                  <p>200 API requests in 30 days</p>
                </div>
                <div class="dash-cur-plan">Upgrade</div>
              </div>
            </section>

            <section class="dash-api-token">
              <div class="dash-api-hd">
                <p class="dash-api-hd-tl">Free API Token</p>
                <p class="dash-api-hd-subtl">200 API requests left.</p>
              </div>
              <div class="dash-api-content">
                <div class="dash-api-content-hd">
                <div class="dash-api-content-sel">
                  <label for="bfe" class="custom-checkbox">
                    <input required type="checkbox" id="bfe" />
                    <span class="checkmark"></span>
                    <p>Block free emails</p>
                  </label>
                  <div class="dash-tool-tip">
                    <img src="/assets/icons/question.svg" />
                  </div>
                </div>
                <div class="dash-api-content-sel">
                    <label for="bbe" class="custom-checkbox">
                      <input required type="checkbox" id="bbe" />
                      <span class="checkmark"></span>
                      <p>Block business emails</p>
                    </label>
                    <div class="dash-tool-tip">
                      <img src="/assets/icons/question.svg" />
                    </div>
                  </div>
                  <div class="dash-api-content-sel">
                    <label for="bde" class="custom-checkbox">
                      <input required type="checkbox" id="bde" />
                      <span class="checkmark"></span>
                      <p>Block disposable emails</p>
                    </label>
                    <div class="dash-tool-tip">
                      <img src="/assets/icons/question.svg" />
                    </div>
                  </div>
                  
                </div>
              </div>
            </section>
          </div>
        </div>
      </div>
    </div>
    <script src="/assets/js/main.js"></script>
  </body>
</html>
