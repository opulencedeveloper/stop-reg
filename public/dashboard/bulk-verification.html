    <div class="dash-wrapper">

        <header class="dash-header">

            <a href="/" class="dash-logo-link">

              <img src="/assets/icons/avatar-filled.svg" alt="User avatar" />
            </div>
            <button id="logout-button" class="dash-logout">

                <img src="/assets/icons/logout-line.svg" />

          <div class="dash-inner-inner-section ">
            <div class="dash-inner-inner-bulk-verification">
              <h1 class="bulk-hd bulktitle">Bulk Verification</h1>
              <form class="bulk-verification-form">
                <fieldset>
                  <label class="bulk-content">
                    Input your data flexibly using domain names or email
                    addresses, whether separated by spaces, delimiters, or
                    arranged on single or multiple lines.
                  </label>

                  <textarea id="bulk-links" class="bulk-links-input" rows="6"
                    placeholder="Enter domains or emails separated by space or comma (e.g., example.com user@email.com)"></textarea>
                </fieldset>

                <button class="bulk-verify-domain-btn">
                  Verify Domains
                </button>
              </form>
            </div>
            <div class="dash-inner-inner-verification-status">
              <div class="verify-status-head">
                <h1 class="bulk-hd">Verification status</h1>
                <button class="bulk-domain-download" id="bulk-domain-download">
                  <div class="bulk-domain-download-icon">
                    <img src="/assets/icons/download-bulk-icon.svg" alt="" />
                  </div>
                  <p>Download CSV</p>
                </button>
              </div>
              <div class="bulk-tb-container">
                <table>
                  <tbody id="disposableResult">

                  </tbody>
                </table>
