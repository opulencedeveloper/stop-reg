<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <!-- Favicon -->
    <!-- <link href="img/favicon.ico" rel="icon"> -->
    <title>StopReg</title>
    <meta name="robots" content="index, follow" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta property="og:title" content="StopReg" />
    <meta property="og:description" content="" />
    <link href="/assets/css/fonts.css" rel="stylesheet" />
    <link href="/assets/css/variables.css" rel="stylesheet" />
    <link href="/assets/css/styles.css" rel="stylesheet" />
    <link href="/assets/css/landing/header.css" rel="stylesheet" />
    <link href="/assets/css/landing/index.css" rel="stylesheet" />
  </head>

  <body>
    <!-- Loading Spinner Start -->
    <div id="spinner-body" class="spinner-body">
      <div class="lds-roller">
        <div></div>
        <div></div>
        <div></div>
        <div></div>
        <div></div>
        <div></div>
        <div></div>
        <div></div>
      </div>
    </div>
    <!-- Loading Spinner End -->

    <main id="content">
      <!-- Mobile Navigation Start -->
      <div class="nav-menu">
        <div class="nav-menu-sect-one">
          <div class="land-logo">
            <img src="/assets/logo/stopreg-logo.svg" />
          </div>
          <div class="nav-icon2-mobile active">
            <span></span>
            <span></span>
            <span></span>
            <span></span>
            <span></span>
            <span></span>
          </div>
        </div>
        <div class="mobile-nav-items">
          <a href="/#api">API</a>
          <a href="/#wordpress-plugin">WordPress Plugin</a>
          <a href="/#pricing">Pricing</a>
          <button content-data-target="fags" class="section-scroller">
            FAQs
          </button>
          <a href="/documentation.html">Documentation</a>
        </div>
        <div class="mobile-nav-btns">
          <button class="signin-overlay-btn">Log In</button>
          <button class="signup-overlay-btn">Create an Account</button>
        </div>
      </div>
      <!-- Mobile Navigation End -->

      <!-- Authentication Overlay Start -->
      <div id="overlay" class="overlay">
        <!-- SignUp Dialog Start -->
        <div id="signup-dialog" class="auth-container overlay-animate">
          <button id="signup-close-btn" class="auth-close-btn">
            <img src="/assets/icons/close-outline.svg" />
          </button>
          <div class="auth-logo">
            <img src="/assets/logo/stopreg-logo.svg" />
          </div>
          <p class="cr-auth-header">Create an Account</p>
          <p class="cr-auth-tle">
            Already have an account?
            <span class="signin-overlay-btn cr-auth-auth">Log In</span>
          </p>
          <form class="form-container">
            <div class="form-item">
              <label for="email">Email</label>
              <input
                id="email"
                required
                type="email"
                placeholder="Example: xyz@gmail.com"
              />
            </div>
            <div class="form-item">
              <div class="form-item-inner">
                <label for="signup-password">Password</label>
              </div>
              <div class="password-container">
                <input
                  required
                  type="password"
                  placeholder="Enter password"
                  id="signup-password"
                /><img
                  id="signup-password-btn"
                  class="password-icon"
                  src="/assets/icons/obsured.svg"
                />
              </div>
            </div>
            <div class="form-item">
              <div class="form-item-inner">
                <label for="signup-cpassword">Confirm Password</label>
              </div>
              <div class="password-container">
                <input
                  required
                  type="password"
                  placeholder="Confirm password"
                  id="signup-cpassword"
                /><img
                  id="signup-cpassword-btn"
                  class="password-icon"
                  src="/assets/icons/obsured.svg"
                />
              </div>
            </div>
            <button class="cr-btn">Create an Account</button>
          </form>
        </div>
        <!-- SignUp Dialog End -->

        <!-- SignIn Dialog Start -->
        <div id="signin-dialog" class="auth-container overlay-animate">
          <button id="signin-close-btn" class="auth-close-btn">
            <img src="/assets/icons/close-outline.svg" />
          </button>
          <div class="auth-logo">
            <img src="/assets/logo/stopreg-logo.svg" />
          </div>
          <p class="cr-auth-header">Log in</p>
          <p class="cr-auth-tle">
            Don't have an account?
            <span class="signup-overlay-btn cr-auth-auth">Sign up</span>
          </p>
          <form class="form-container">
            <div class="form-item">
              <label for="signin-email">Email</label>
              <input
                id="signin-email"
                required
                type="email"
                placeholder="Example: xyz@gmail.com"
              />
            </div>
            <div class="form-item">
              <div class="form-item-inner">
                <label for="signin-password">Password</label>
              </div>
              <div class="password-container">
                <input
                  required
                  type="password"
                  placeholder="Enter password"
                  id="signin-password"
                /><img
                  id="signin-password-btn"
                  class="password-icon"
                  src="/assets/icons/obsured.svg"
                />
              </div>
            </div>
            <button class="cr-btn">Log in</button>
          </form>
        </div>
        <!-- SignIn Dialog Start -->
      </div>
      <!-- Authentication Overlay End -->

      <!-- Header Start -->
      <header class="main-head-cont">
        <div class="main-head-wrapper">
          <a href="/" class="land-logo">
            <img src="/assets/logo/stopreg-logo.svg" />
          </a>
          <nav class="nav-wrapper">
            <a href="/#api">API</a>
            <a href="/#wordpress-plugin">WordPress Plugin</a>
            <a href="/#pricing">Pricing</a>
            <a href="/#fags">FAQs</a>
            <a href="/documentation.html">Documentation</a>
          </nav>
          <div class="auth-wrapper">
            <button class="signin-overlay-btn">Log In</button>
            <button class="signup-overlay-btn">Create an Account</button>
          </div>

          <div class="nav-icon2">
            <span></span>
            <span></span>
            <span></span>
            <span></span>
            <span></span>
            <span></span>
          </div>
        </div>
      </header>
      <!-- Header End -->

      <div class="notfound-contianer">
        <p class="notfound-tle">Page not found</p>
        <p class="notfound-stle">
          We seem to have run into a bit of a problem with this page.
        </p>
        <a class="notfound-hme-lnk" href="/">Home Page</a>
      </div>
    </main>
    <script src="/assets/js/main.js"></script>
    <script src="/assets/js/landing/index.js"></script>
    <script src="/assets/js/landing/header.js"></script>
    <script></script>
  </body>
</html>
