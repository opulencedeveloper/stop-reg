  <body>
    <!-- Loading Spinner Start -->
    <div id="spinner-body" class="spinner-body">
      <div class="lds-roller">
        <div></div>
        <div></div>
        <div></div>
        <div></div>
        <div></div>
        <div></div>
        <div></div>
        <div></div>
      </div>
    </div>
    <!-- Loading Spinner End -->

    <main id="content">
      <article style="max-width: 800px; margin: 0 auto; padding: 40px 20px;">
        <div class="dash-inner-inner-check-email">
          <header>
            <h1 class="check-disposable-email-head">
              API Email Check
            </h1>
            <p class="disposable-email-disc">
              Enter your API token and email address to verify the email using the API
            </p>
          </header>

          <div class="form-cont">
            <form id="api-check-form" aria-label="API Email Check Form">
              <fieldset>
                <legend class="sr-only">Email Validation Form</legend>
                <div class="check-disposable-email-form">
                  <label for="api-token">API Token</label>
                  <input 
                    id="api-token" 
                    type="text" 
                    placeholder="Enter your API token"
                    required
                    aria-required="true"
                    aria-describedby="api-token-desc"
                  />
                  <span id="api-token-desc" class="sr-only">Enter your StopReg API token</span>
                </div>
                <div class="check-disposable-email-form" style="margin-top: 16px;">
                  <label for="check-email">Email Address</label>
                  <input 
                    id="check-email" 
                    type="email" 
                    placeholder="admin@samplemail.com"
                    required
                    aria-required="true"
                    aria-describedby="email-desc"
                  />
                  <span id="email-desc" class="sr-only">Enter the email address to validate</span>
                </div>
              </fieldset>
              <button type="submit" class="bulk-check-email-btn" aria-label="Submit email validation request">Check Email</button>
            </form>
            <section id="api-check-result" class="disposal-email-result-cont" aria-live="polite" aria-atomic="true">
              <!-- Results will be displayed here -->
            </section>
          </div>
        </div>
      </article>
    </main>

      src="https://cdnjs.cloudflare.com/ajax/libs/izitoast/1.4.0/js/iziToast.min.js"
